opponent_simple_controller:
  ros__parameters:
    # Basic vehicle and speed limits (slower than ego)
    wheelbase: 0.33
    steer_limit: 0.576
    steer_rate_limit: 4.0
    accel_limit: 1.5
    decel_limit: -2.0
    speed_limit: 0.8          # [m/s] overall speed cap

    # Path following
    lookahead_distance: 0.8
    min_lookahead: 0.4
    max_lookahead: 1.2
    lookahead_speed_gain: 0.3
    lookahead_error_gain: 1.2

    # Topics for opponent car
    odom_topic: '/opp_racecar/odom'
    path_topic: '/opponent_global_raceline'
    drive_topic: '/opp_drive'
    scan_topic: '/opp_scan'

    # Speed targets
    target_speed: 0.6
    max_speed: 0.8
    max_steer_angle: 0.576
    max_steer_rate: 4.0

    # Basic steering / controller gains (copied and slightly reduced from ego)
    lateral_error_gain: 1.3
    heading_error_gain: 0.7
    curvature_feedforward_gain: 1.0
    smoothing_factor: 0.6
    steering_sign: 1.0
    direct_correction_gain: 0.7
    direct_correction_limit: 0.7

    pid_kp: 0.6
    pid_ki: 0.02
    pid_kd: 0.15
    pid_integral_limit: 0.0

    use_path_interpolation: true

    # Collision avoidance for opponent can be simplified or disabled
    enable_collision_avoidance: false

    # Disable complex following / overtake behaviors for opponent
    follow_distance_threshold: 0.0
    follow_min_distance: 0.0
    follow_speed_factor: 1.0
    follow_min_speed_ratio: 0.0
    target_follow_gap: 0.0

    enable_out_in_out: false
    overtake_max_duration: 0.0
    overtake_lateral_offset: 0.0
    return_to_line_distance: 0.0
    min_overtake_gap: 0.0
    overtake_speed_boost: 0.0
    post_overtake_speed_factor: 1.0
    post_overtake_duration: 0.0
    overtake_steer_max: 0.0
    overtake_steer_decay: 0.0
    overtake_wall_caution_dist: 0.0


