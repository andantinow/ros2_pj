# =============================================================================
# NMPC (Nonlinear Model Predictive Control) Configuration for F1TENTH Racing
# =============================================================================
# This configuration file contains all tunable parameters for the NMPC controller.
# Based on ForzaETH autonomous racing stack architecture and recommendations from:
# - Issue 3.1: Levenberg-Marquardt regularization (Status 3 prevention)
# - Issue 3.3: Latency compensation
# - Issue 5.1: Lateral tolerance tube
# - Issue 6.1: Soft constraints (Status 4 prevention)
#
# V3.0 Updates:
# - Simplified collision handling (stop -> wait -> straight reverse)
# - Opponent following and overtaking system
# - Overtaking path visualization
#
# Reference: https://github.com/ForzaETH/race_stack
# =============================================================================

nmpc_engine_node:
  ros__parameters:
    # =========================================================================
    # PREDICTION HORIZON SETTINGS
    # =========================================================================
    # Tp = prediction_horizon / prediction_steps determines time resolution
    # Example: 1.5s / 15 = 0.1s (100ms) per step
    # 
    # Too short horizon: Cannot anticipate upcoming corners, late braking
    # Too long horizon: High computational cost, real-time violation risk
    # Recommended for F1TENTH: 1.0-2.0 seconds
    prediction_horizon: 1.8      # [seconds] Prediction horizon length
    prediction_steps: 15         # Number of discretization steps (N)
    control_rate_hz: 50.0        # [Hz] Control loop frequency
    
    # =========================================================================
    # TARGET SPEED AND VEHICLE PARAMETERS
    # =========================================================================
    # nominal_speed: Target racing speed - can be increased for faster racing
    # Default: 2.5 m/s (matched to nmpc_engine_node.cpp)
    # For competitive racing, consider increasing to 3.0-4.0 m/s
    nominal_speed: 4.5           # [m/s] Target racing speed (increased for faster racing)
    solver_wheelbase: 0.33       # [m] F1TENTH wheelbase
    
    # =========================================================================
    # STATE ESTIMATION SOURCE
    # =========================================================================
    use_dual_ekf: true           # Use Dual EKF output (recommended)
    odom_topic: '/dual_ekf/global_odom'
    path_topic: '/global_raceline'
    drive_topic: '/drive'
    scan_topic: '/scan'
    
    # =========================================================================
    # COST FUNCTION WEIGHTS (Q, R matrices)
    # =========================================================================
    # These weights define the optimization objective:
    # J = sum(w_pos*e_pos^2 + w_yaw*e_yaw^2 + w_vel*e_vel^2 + ...)
    #
    # Higher weight = stronger tracking of that objective
    # Lower weight = more flexibility in that dimension
    #
    # NOTE: These values match the optimized defaults in nmpc_engine_node.cpp
    # based on ForzaETH reference architecture recommendations.
    
    # State tracking weights (v4.0: tuned for curvature-based speed control)
    w_pos: 5.5                   # Position tracking weight (increased for stronger path following)
    w_yaw: 6.5                   # Heading tracking weight (increased for better path alignment)
    w_vel: 5.0                   # Velocity tracking weight (increased for strong speed tracking)
    
    # Control effort weights
    w_steer: 1.0                 # Steering angle magnitude penalty (balanced to allow path following)
    w_accel: 0.3                 # Acceleration magnitude penalty
    
    # CRITICAL: Control rate (slew rate) weights
    # Balanced to allow smooth path following while preventing excessive steering
    w_steer_rate: 350.0          # Steering rate penalty (balanced for smooth path following)
    w_accel_rate: 60.0           # Acceleration rate penalty
    
    # Terminal cost weight (Issue 7.2: convergence improvement)
    w_terminal: 30.0             # Weight on final state in horizon
    
    # =========================================================================
    # LATERAL TOLERANCE TUBE (Issue 5.1)
    # =========================================================================
    # Allows deviation from reference within a "tube" around the path
    # Enables NMPC to find optimal racing lines within track boundaries
    # Reduced for stronger path following
    lateral_tolerance: 0.12      # [m] Tighter tolerance for stronger path following
    
    # =========================================================================
    # LATENCY COMPENSATION (Issue 3.3)
    # =========================================================================
    # Compensates for system delay (sensor -> computation -> actuator)
    # Forward simulates state by this amount before solving
    # Set to 0.0 to disable (more conservative, prevents state mismatch)
    # Typical F1TENTH latency: 30-100ms (set to actual measured value)
    latency_compensation_sec: 0.0   # [seconds] Disabled for conservative control
    
    # =========================================================================
    # SOLVER SETTINGS (V4.0: Improved Convergence)
    # =========================================================================
    # Levenberg-Marquardt regularization prevents numerical issues
    # when Hessian becomes singular (e.g., at zero velocity)
    # H_regularized = H + lambda * I
    #
    # v4.0 tuning to reduce MAX_ITER failures:
    # - Slightly increased L-M regularization for stability
    # - Increased max iterations for complex maneuvers
    levenberg_marquardt: 0.02    # L-M regularization factor (increased for stability)
    max_solver_iterations: 25    # Maximum SQP iterations per solve (increased)
    
    # =========================================================================
    # DYNAMIC MODEL PARAMETERS (High-speed Pacejka tire model)
    # =========================================================================
    # Below threshold: Kinematic bicycle model (simple, stable)
    # Above threshold: Dynamic bicycle model with tire slip
    # Set to very high value (100.0) to effectively disable dynamic model
    # This ensures kinematic model is always used for predictable behavior
    dynamic_model_threshold: 100.0  # [m/s] Kinematic model only (dynamic disabled)
    vehicle_mass: 3.5            # [kg] Vehicle mass
    vehicle_inertia: 0.04        # [kg*m^2] Yaw moment of inertia
    
    # =========================================================================
    # PHYSICAL CONSTRAINTS
    # =========================================================================
    # Hard limits on vehicle actuators
    max_steer: 0.576             # [rad] Maximum steering angle (~33 degrees)
    max_steer_rate: 1.5          # [rad/s] Maximum steering rate (reduced from 1.8)
    max_speed: 2.5               # [m/s] Maximum forward speed
    max_accel: 2.0               # [m/s^2] Maximum acceleration (reduced)
    min_accel: -3.5              # [m/s^2] Maximum deceleration (softer braking)
    
    # =========================================================================
    # SIMPLIFIED COLLISION HANDLING (V4.0 + V5.1: Reduced LiDAR Range)
    # =========================================================================
    # When wall/obstacle collision detected:
    # 1. STOP immediately (speed=0, steer=0)
    # 2. Wait briefly (stop_duration)
    # 3. Only reverse if still blocked (gentle, short)
    # 4. Resume normal operation after cooldown
    #
    # v4.0: Simpler handling - just stop stably without weird steering or strong reverse
    # v5.1 (2025-01): Reduced LiDAR range per user request
    #   - A2 zone avoidance DISABLED (no steering from obstacles)
    #   - A1 threshold reduced to ignore distant walls
    #   - Speed comes from: curvature, FOLLOW/OVERTAKE, hard collision only
    
    enable_collision_avoidance: true
    
    # Collision detection thresholds (v5.1: REDUCED ranges for near-field only)
    # User request: Reduce effective LiDAR range, ignore distant walls
    a1_threshold: 0.25           # [m] Hard STOP only (earlier stop near wall)
    a2_threshold: 0.25           # [m] NOT USED (avoidance disabled, kept for compatibility)
    a2_urgent_threshold: 0.20    # [m] NOT USED (avoidance disabled)
    
    # Collision response timing (v4.0: hold stop, minimal reverse)
    stop_duration: 0.4           # [s] Time to hold stop (0.3-0.5s as requested)
    reverse_duration: 0.3        # [s] Time to reverse (reduced)
    reverse_speed: 0.8           # [m/s] Reverse speed (reduced for gentle recovery)
    
    # Steering avoidance gains (A2 zone - repulsive force approach)
    a1_steer_gain: 1.0           # Not used in simplified mode (straight reverse)
    a2_steer_gain: 1.5           # Repulsive force gain for side obstacles
    a2_urgent_steer_gain: 2.0    # Increased gain in urgent situations
    a2_max_steer_ratio: 1.0      # Full steering allowed
    a2_urgent_steer_ratio: 1.0   # Full steering in urgent mode
    
    # =========================================================================
    # OPPONENT FOLLOWING AND OVERTAKING SYSTEM (V4.0 + V5.1)
    # =========================================================================
    # v4.0 Philosophy:
    # - FOLLOW: politely track opponent at safe distance with similar speed
    # - OVERTAKE: only in allowed zones, commit and accelerate clearly
    # - Visualized in RViz (MAGENTA=left, CYAN=right, YELLOW=active)
    #
    # v5.1 (2025-01): Reduced detection range per user request
    #   - Focus on close-range opponent only
    #   - Avoid being overly conservative with distant detections
    
    enable_overtaking: true
    
    # Detection and following (v5.1: reduced range for near-field focus)
    # v6.0: Increased following distance for more relaxed, safer following behavior
    opponent_detection_range: 3.0     # [m] Range to detect opponent ahead (increased for earlier detection)
    opponent_following_distance: 2.5  # [m] Safe following distance (INCREASED from 1.0 for larger gap)
    opponent_speed_tracking_gain: 0.85 # Speed limiting when following (0.85 = 85% of opponent speed)
    
    # v4.0 FOLLOW behavior
    # v6.0: Increased follow margin for more comfortable gap maintenance
    follow_margin: 0.15               # [m/s] Speed margin below opponent (INCREASED from 0.05 for calmer following)
    v_min_follow: 0.5                 # [m/s] Minimum follow speed (increased - 기어가지 않게)
    
    # v4.0 OVERTAKE behavior (committed, fast overtaking)
    overtake_path_width: 0.75         # [m] Lateral offset for overtaking paths (slightly reduced for safety)
    overtake_decision_distance: 2.0   # [m] Distance to start considering overtake (reduced for earlier decision)
    overtake_boost: 0.4               # [m/s] Speed boost above opponent during overtake (increased for decisive overtake)
    overtake_min_commit_time: 1.5     # [s] Min time to commit to overtake (reduced for quicker commits)
    overtake_completion_timeout: 2.5  # [s] Time after passing to confirm complete
    
    # Overtake corridor clearance parameters (PHASE 3: corridor-based overtaking)
    # These define the minimum required lateral space to attempt overtaking
    # Formula: min_clearance = opponent_width * width_factor + safety_margin + path_width
    # Target: ~0.5-0.7m total gap for passable corridor
    overtake_opponent_width: 0.35     # [m] Opponent vehicle width
    overtake_width_factor: 1.0        # [-] Multiplier for opponent width (1.0 = exact width)
    overtake_safety_margin: 0.20      # [m] Additional safety margin on the side
    overtake_min_longitudinal_window: 3.0  # [m] Minimum remaining distance in overtake zone
    
    # With these settings:
    # min_required = 0.35 * 1.0 + 0.20 + 0.75 = 1.30m total lateral clearance
    # This allows overtaking when there's a ~1.3m corridor between wall and opponent
    # which corresponds to ego_width (~0.35m) + 0.5-0.6m gap + opponent space
    
    # v4.0 Overtake zones (s-intervals on raceline where overtaking is allowed)
    # Default: full track allowed (0 to 1000m)
    # Override in track-specific config to define specific zones
    overtake_zone_starts: [0.0]
    overtake_zone_ends: [1000.0]
    
    # =========================================================================
    # CURVATURE-BASED SPEED CONTROL (V4.0)
    # =========================================================================
    # Speed is determined by raceline curvature, NOT wall proximity
    # Policy:
    #   |κ| < k1 (straight): v_ref = v_max_straight
    #   k1 ≤ |κ| ≤ k2: linear interpolation
    #   |κ| > k2 (tight corner): v_ref = v_min_corner
    #
    # This ensures OUT-IN-OUT racing line with proper corner speed
    
    # Lower corner thresholds so more segments are treated as corners
    curvature_k1: 0.06                # [1/m] Straights threshold (slightly increased to avoid false corner detection)
    curvature_k2: 0.30                # [1/m] Tight corner threshold (increased to delay corner recognition)
    v_max_straight: 2.5               # [m/s] Max speed on straights
    v_min_corner: 1.2                 # [m/s] Reduced speed in tight corners for better control
    curvature_lookahead: 4            # [points] Moderate lookahead for pre-brake (increased from 3)

    # Corner speed cap based on steering magnitude (safety layer)
    corner_steer_threshold: 0.15      # [rad] Treat corner earlier based on steering
    corner_speed_cap: 1.8             # [m/s] Lower cap on speed while cornering (reduced from 2.0)
    
    # =========================================================================
    # CORNER EXIT SMOOTHING (V5.0)
    # =========================================================================
    # Reduces excessive lateral movement when exiting corners and rejoining straights.
    # Problem being solved:
    #   1. Car hugs outer wall too much on corner exit
    #   2. Large steering corrections when rejoining the straight
    #
    # Solution:
    #   1. Wall margin constraint: keep distance from outer wall on exit
    #   2. Steering rate limiting: smoother transitions to straight
    #   3. Lateral deviation limiting: prevent overshooting the raceline
    
    enable_corner_exit_smoothing: true
    
    # Wall margin constraint
    # On corner exit, enforce minimum distance from wall to avoid hugging it
    corner_exit_wall_margin: 0.15     # [m] Further reduced to minimize OUT movement on corner exit
    
    # Lateral deviation limit
    # Maximum allowed lateral deviation from reference during corner exit
    # Prevents the car from pushing too far to one side and ensures return to center
    corner_exit_lateral_limit: 0.06   # [m] Moderate limit for better path following
    
    # Steering rate limiting
    # Reduces steering magnitude during corner exit to prevent jerky corrections
    # 0.0 = no steering allowed, 1.0 = full steering allowed
    corner_exit_steer_rate_limit: 0.8 # [ratio] Higher limit for better path following
    
    # Transition time
    # Duration of the smoothing period after exiting a corner
    # Longer = more gradual transition, shorter = quicker return to normal
    corner_exit_transition_time: 0.5  # [s] Shorter transition time to minimize OUT-IN-OUT movement
