# =============================================================================
# NMPC (Nonlinear Model Predictive Control) Configuration for F1TENTH Racing
# =============================================================================
# This configuration file contains all tunable parameters for the NMPC controller.
# Based on ForzaETH autonomous racing stack architecture and recommendations from:
# - Issue 3.1: Levenberg-Marquardt regularization (Status 3 prevention)
# - Issue 3.3: Latency compensation
# - Issue 5.1: Lateral tolerance tube
# - Issue 6.1: Soft constraints (Status 4 prevention)
#
# V3.0 Updates:
# - Simplified collision handling (stop -> wait -> straight reverse)
# - Opponent following and overtaking system
# - Overtaking path visualization
#
# Reference: https://github.com/ForzaETH/race_stack
# =============================================================================

nmpc_engine_node:
  ros__parameters:
    # =========================================================================
    # PREDICTION HORIZON SETTINGS
    # =========================================================================
    # Tp = prediction_horizon / prediction_steps determines time resolution
    # Example: 1.5s / 15 = 0.1s (100ms) per step
    # 
    # Too short horizon: Cannot anticipate upcoming corners, late braking
    # Too long horizon: High computational cost, real-time violation risk
    # Recommended for F1TENTH: 1.0-2.0 seconds
    prediction_horizon: 1.5      # [seconds] Prediction horizon length
    prediction_steps: 15         # Number of discretization steps (N)
    control_rate_hz: 50.0        # [Hz] Control loop frequency
    
    # =========================================================================
    # TARGET SPEED AND VEHICLE PARAMETERS
    # =========================================================================
    # nominal_speed: Target racing speed - can be increased for faster racing
    # Default: 2.5 m/s (matched to nmpc_engine_node.cpp)
    # For competitive racing, consider increasing to 3.0-4.0 m/s
    nominal_speed: 2.5           # [m/s] Target racing speed
    solver_wheelbase: 0.33       # [m] F1TENTH wheelbase
    
    # =========================================================================
    # STATE ESTIMATION SOURCE
    # =========================================================================
    use_dual_ekf: true           # Use Dual EKF output (recommended)
    odom_topic: '/dual_ekf/global_odom'
    path_topic: '/global_raceline'
    drive_topic: '/drive'
    scan_topic: '/scan'
    
    # =========================================================================
    # COST FUNCTION WEIGHTS (Q, R matrices)
    # =========================================================================
    # These weights define the optimization objective:
    # J = sum(w_pos*e_pos^2 + w_yaw*e_yaw^2 + w_vel*e_vel^2 + ...)
    #
    # Higher weight = stronger tracking of that objective
    # Lower weight = more flexibility in that dimension
    #
    # NOTE: These values match the optimized defaults in nmpc_engine_node.cpp
    # based on ForzaETH reference architecture recommendations.
    
    # State tracking weights (matched to nmpc_engine_node.cpp defaults)
    w_pos: 10.0                  # Position tracking weight (lateral error)
    w_yaw: 7.0                   # Heading tracking weight (reduced to prevent "heading obsession" in curves)
    w_vel: 3.0                   # Velocity tracking weight
    
    # Control effort weights
    w_steer: 0.5                 # Steering angle magnitude penalty
    w_accel: 0.3                 # Acceleration magnitude penalty
    
    # CRITICAL: Control rate (slew rate) weights
    # Issue 3.1: High steering rate weight prevents oscillation on straights
    # Reduced from 600 to 200 to allow faster steering response in curves
    # This helps prevent "sluggish steering" feeling in corners
    w_steer_rate: 200.0          # Steering rate penalty - reduced for better curve response
    w_accel_rate: 60.0           # Acceleration rate penalty
    
    # Terminal cost weight (Issue 7.2: convergence improvement)
    w_terminal: 30.0             # Weight on final state in horizon
    
    # =========================================================================
    # LATERAL TOLERANCE TUBE (Issue 5.1)
    # =========================================================================
    # Allows deviation from reference within a "tube" around the path
    # Enables NMPC to find optimal racing lines within track boundaries
    # Reduced from 0.25m to 0.15m for tighter path following
    lateral_tolerance: 0.15      # [m] Allowed deviation from centerline (±)
    
    # =========================================================================
    # LATENCY COMPENSATION (Issue 3.3)
    # =========================================================================
    # Compensates for system delay (sensor -> computation -> actuator)
    # Forward simulates state by this amount before solving
    # Set to 0.0 to disable (more conservative, prevents state mismatch)
    # Typical F1TENTH latency: 30-100ms (set to actual measured value)
    latency_compensation_sec: 0.0   # [seconds] Disabled for conservative control
    
    # =========================================================================
    # SOLVER SETTINGS (Issue 3.1: Status 3 Prevention)
    # =========================================================================
    # Levenberg-Marquardt regularization prevents numerical issues
    # when Hessian becomes singular (e.g., at zero velocity)
    # H_regularized = H + lambda * I
    levenberg_marquardt: 0.01    # L-M regularization factor (1e-3 to 1e-1)
    max_solver_iterations: 20    # Maximum SQP iterations per solve
    
    # =========================================================================
    # DYNAMIC MODEL PARAMETERS (High-speed Pacejka tire model)
    # =========================================================================
    # Below threshold: Kinematic bicycle model (simple, stable)
    # Above threshold: Dynamic bicycle model with tire slip
    # Set to very high value (100.0) to effectively disable dynamic model
    # This ensures kinematic model is always used for predictable behavior
    dynamic_model_threshold: 100.0  # [m/s] Kinematic model only (dynamic disabled)
    vehicle_mass: 3.5            # [kg] Vehicle mass
    vehicle_inertia: 0.04        # [kg*m^2] Yaw moment of inertia
    
    # =========================================================================
    # PHYSICAL CONSTRAINTS
    # =========================================================================
    # Hard limits on vehicle actuators
    max_steer: 0.576             # [rad] Maximum steering angle (~33 degrees)
    max_steer_rate: 1.8          # [rad/s] Maximum steering rate
    max_speed: 6.0               # [m/s] Maximum forward speed
    max_accel: 4.0               # [m/s^2] Maximum acceleration
    min_accel: -6.0              # [m/s^2] Maximum deceleration (negative)
    
    # =========================================================================
    # SIMPLIFIED COLLISION HANDLING (V3.0)
    # =========================================================================
    # When wall/obstacle collision detected:
    # 1. STOP immediately (stop_duration)
    # 2. Wait briefly
    # 3. REVERSE STRAIGHT BACK (no steering to avoid spinning)
    # 4. Resume normal operation after cooldown
    #
    # This removes all complex steering during collision, fixing the spinning issue
    
    enable_collision_avoidance: true
    
    # Collision detection thresholds
    a1_threshold: 0.3            # [m] Distance triggering collision (front only)
    a2_threshold: 0.4            # [m] Distance triggering steering avoidance
    a2_urgent_threshold: 0.25    # [m] Distance for urgent avoidance
    
    # Collision response timing
    stop_duration: 0.3           # [s] Time to stop before reversing
    reverse_duration: 0.5        # [s] Time to reverse
    reverse_speed: 1.5           # [m/s] Reverse speed (straight back)
    
    # Steering avoidance gains (A2 zone - repulsive force approach)
    a1_steer_gain: 1.0           # Not used in simplified mode (straight reverse)
    a2_steer_gain: 1.5           # Repulsive force gain for side obstacles
    a2_urgent_steer_gain: 2.0    # Increased gain in urgent situations
    a2_max_steer_ratio: 1.0      # Full steering allowed
    a2_urgent_steer_ratio: 1.0   # Full steering in urgent mode
    
    # =========================================================================
    # OPPONENT FOLLOWING AND OVERTAKING SYSTEM (V3.0)
    # =========================================================================
    # Detects opponent ahead using LiDAR and opponent odometry
    # - When following: limits speed to opponent speed
    # - When safe: executes overtaking maneuver
    # - Overtaking paths visualized in RViz (MAGENTA=left, CYAN=right)
    
    enable_overtaking: true
    
    # Detection and following
    opponent_detection_range: 3.0     # [m] Range to detect opponent ahead
    opponent_following_distance: 1.0  # [m] Safe following distance
    opponent_speed_tracking_gain: 0.8 # Speed limiting when following (0.8 = 80% of opponent speed)
    
    # Overtaking
    overtake_path_width: 0.8          # [m] Lateral offset for overtaking paths
    overtake_decision_distance: 2.5   # [m] Distance to start considering overtake
