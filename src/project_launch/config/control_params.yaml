nmpc_engine_node:
  ros__parameters:
    wheelbase: 0.33
    steer_limit: 0.41
    steer_rate_limit: 2.0
    accel_limit: 4.0
    decel_limit: -6.0
    speed_limit: 6.0
    lookahead_distance: 1.0
    min_lookahead: 0.6
    max_lookahead: 2.5
    lookahead_speed_gain: 0.8
    use_vref: true
    # Topic remappings
    odom_topic: '/car_state/odom_GT'
    path_topic: '/global_raceline'
    drive_topic: '/drive'
    target_speed: 1.5
    max_steer_angle: 0.418
    max_steer_rate: 2.0
    lateral_error_gain: 0.8
    heading_error_gain: 0.5
    curvature_feedforward_gain: 1.0
    smoothing_factor: 0.3
    pid_kp: 1.2
    pid_ki: 0.05
    pid_kd: 0.3
    use_path_interpolation: true
    steering_sign: 1.0  # Flip to -1.0 if vehicle goes wrong direction (left/right issue)
