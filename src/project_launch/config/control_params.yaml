nmpc_engine_node:
  ros__parameters:
    wheelbase: 0.33
    steer_limit: 0.55
    steer_rate_limit: 5.0
    accel_limit: 4.0
    decel_limit: -6.0
    speed_limit: 6.0
    max_speed: 2.0
    lookahead_distance: 1.8  # Very long lookahead for Pure Pursuit-focused smooth entry
    min_lookahead: 0.4
    max_lookahead: 1.5
    lookahead_speed_gain: 0.4  # Reduced speed dependency
    lookahead_error_gain: 1.2  # Increased - reduce lookahead more when error is large
    use_vref: true
    # Topic remappings
    odom_topic: '/car_state/odom_GT'
    path_topic: '/global_raceline'
    drive_topic: '/drive'
    target_speed: 1.5  # Maintain speed for smooth operation
    max_steer_angle: 0.52  # Unlocked for tight cornering (~30 degrees)
    max_steer_rate: 1.0
    lateral_error_gain: 1.5  # Increased for more sensitive lateral correction
    heading_error_gain: 0.1  # Ignore heading errors, focus on target point only
    curvature_feedforward_gain: 0.0  # Disable curvature prediction at startup
    smoothing_factor: 0.3  # Reduced for faster response
    direct_correction_gain: 1.2  # Increased for aggressive correction when far off
    direct_correction_limit: 1.0  # Increased limit for larger corrections
    pid_kp: 0.1  # Very low gain to ignore immediate lateral errors, rely on Pure Pursuit
    pid_ki: 0.05
    pid_kd: 1.0  # Maximum damping to suppress oscillation
    use_path_interpolation: true
    steering_sign: 1.0
