nmpc_engine_node:
  ros__parameters:
    wheelbase: 0.33
    steer_limit: 0.55
    steer_rate_limit: 5.0
    accel_limit: 4.0
    decel_limit: -6.0
    speed_limit: 6.0
    lookahead_distance: 1.2  # Increased for less sensitive, smoother tracking
    min_lookahead: 0.6  # Increased minimum for smoother control
    max_lookahead: 2.0  # Increased maximum for less aggressive control
    lookahead_speed_gain: 0.4  # Speed dependency
    lookahead_error_gain: 0.8  # Reduced - less aggressive lookahead reduction
    use_vref: true
    # Topic remappings
    odom_topic: '/car_state/odom_GT'  # Simulator odom (QoS compatible)
    path_topic: '/global_raceline'
    drive_topic: '/drive'
    target_speed: 1.0  # Reduced speed for smoother driving
    max_steer_angle: 0.55
    max_steer_rate: 5.0
    lateral_error_gain: 1.0  # Reduced for less sensitive lateral correction
    heading_error_gain: 0.5  # Reduced for smoother heading correction
    curvature_feedforward_gain: 0.8  # Reduced for smoother curve anticipation
    smoothing_factor: 0.5  # Increased for smoother response
    direct_correction_gain: 0.8  # Reduced for less aggressive correction
    direct_correction_limit: 0.8  # Reduced limit for smaller corrections
    pid_kp: 1.2  # Reduced proportional gain
    pid_ki: 0.05  # Reduced integral gain
    pid_kd: 0.3  # Reduced derivative gain
    use_path_interpolation: true
    steering_sign: 1.0  # Positive = standard, -1.0 = flip if vehicle goes wrong direction
