simple_controller:
  ros__parameters:
    wheelbase: 0.33
    steer_limit: 0.576
    steer_rate_limit: 5.0
    accel_limit: 4.0
    decel_limit: -6.0
    speed_limit: 6.0           # Increased for faster racing (5.0 -> 6.0)
    lookahead_distance: 0.8    # Much reduced for tighter path following (1.5 -> 0.8)
    min_lookahead: 0.4         # Much reduced for closer lookahead at low speed (0.8 -> 0.4)
    max_lookahead: 1.2         # Much reduced for tighter corner tracking (2.5 -> 1.2)
    lookahead_speed_gain: 0.3  # Reduced for tighter speed-based lookahead (0.5 -> 0.3)
    lookahead_error_gain: 1.2  # Reduced for smoother lateral error correction (1.5 -> 1.2)
    use_vref: true
    # Topic remappings
    odom_topic: '/car_state/odom_GT'
    path_topic: '/global_raceline'
    drive_topic: '/drive'
    scan_topic: '/scan'        # LiDAR scan topic for collision detection
    target_speed: 4.0          # Increased for faster racing (3.0 -> 4.0)
    max_steer_angle: 0.576     # Max steering angle: 33 degrees
    max_steer_rate: 4.0        # Slightly reduced for smoother steering response (5.0 -> 4.0)
    lateral_error_gain: 1.5    # Reduced for less aggressive lateral correction (2.0 -> 1.5)
    heading_error_gain: 0.8    # Reduced for smoother heading correction (1.0 -> 0.8)
    curvature_feedforward_gain: 1.2  # Reduced for less aggressive corner anticipation (1.5 -> 1.2)
    smoothing_factor: 0.6      # Reduced for smoother response (0.7 -> 0.6)
    direct_correction_gain: 0.8  # Reduced for less direct lateral correction (1.0 -> 0.8)
    direct_correction_limit: 0.8  # Reduced for narrower lateral correction range (1.0 -> 0.8)
    pid_kp: 0.7                # Reduced for less aggressive lateral control (1.0 -> 0.7)
    pid_ki: 0.03               # Reduced for less integral buildup (0.05 -> 0.03)
    pid_kd: 0.2                # Reduced for less aggressive damping (0.3 -> 0.2)
    use_path_interpolation: true
    steering_sign: 1.0  # Normal direction (positive = left turn)
    
    # === A1/A2 범위 기반 충돌 회피 시스템 (V5.1: REDUCED RANGES) ===
    # v5.1 (2025-01): Per user request - reduce LiDAR range, disable soft slowdowns
    # A1 범위: 매우 좁은 범위 - 이 안에 들어오면 hard STOP + 후진만
    # A2 범위: DISABLED - 조향 회피 비활성화 (속도는 곡률 기반으로만 결정)
    a1_threshold: 0.15         # A1 범위 (meters) - hard collision STOP only (reduced from 0.12)
    a2_threshold: 0.25         # A2 범위 (meters) - NOT USED (disabled)
    a2_urgent_threshold: 0.20  # A2 긴급 범위 (meters) - NOT USED (disabled)
    a1_side_factor: 0.8        # A1 측면 거리 팩터 (a1_threshold * 이 값)
    a2_max_steer_ratio: 1.0    # A2 최대 조향 비율 - 완전 반대 조향 (0.8 -> 1.0)
    a2_urgent_steer_ratio: 1.0 # A2 긴급시 최대 조향 비율 - 완전 반대 조향
    reverse_speed: 1.0         # 후진 속도 (m/s) - 더 시원하게 (increased from 0.5)
    reverse_duration: 0.8      # 후진 지속 시간 (seconds)
    a1_steer_gain: 0.8         # A1 범위에서 후진 시 조향 강도
    a2_steer_gain: 1.0         # A2 범위에서 회피 조향 강도 - 완전 반대 조향 (0.8 -> 1.0)
    a2_urgent_steer_gain: 1.5  # A2 긴급시 조향 강도 - 1.5배 강화
    enable_collision_avoidance: true  # 충돌 회피 활성화
    
    # === Following 시스템 (앞 차 추적) ===
    # Following distance increased for more relaxed, less nervous behavior
    # This gives room to react and creates a clearer gap before overtaking
    follow_distance_threshold: 4.0   # following 시작 거리 (m) - increased from 2.5 for noticeably farther following
    follow_min_distance: 0.5         # 최소 유지 거리 (m)
    follow_speed_factor: 0.4         # following 시 속도 비율 (0.2 -> 0.4, less conservative following)
    follow_min_speed_ratio: 0.15     # 최소 속도 비율 (15%) - higher min speed during follow
    speed_smooth_factor: 0.1         # 속도 변화 스무딩
    target_follow_gap: 3.0           # 목표 차간 거리 (m) - increased from 2.0 for noticeably larger gap
    
    # === 추월 조건 체크 ===
    narrow_road_threshold: 1.2       # 좁은 도로 판단 기준 (좌우 합계 m) - reduced for more overtake opportunities
    min_visibility_angle: 0.6        # 최소 시야 각도 (rad) - increased for less strict angle requirement
    
    # === 코너링 설정 (추월 및 코너 핸들링) ===
    corner_curvature_threshold: 0.5  # 곡률이 이 값 이상이면 코너로 판단
    corner_speed_factor: 0.65        # 코너에서 속도 감소 비율 (0.5 -> 0.65, faster in corners)
    corner_steer_amplify: 1.5        # 코너에서 조향각 증폭 비율 (더 큰 각도로 돌기)
