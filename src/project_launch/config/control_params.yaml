simple_controller:
  ros__parameters:
    wheelbase: 0.33
    steer_limit: 0.55
    steer_rate_limit: 5.0
    accel_limit: 4.0
    decel_limit: -6.0
    speed_limit: 6.0
    lookahead_distance: 0.8
    min_lookahead: 0.5
    max_lookahead: 1.5
    lookahead_speed_gain: 0.3
    lookahead_error_gain: 1.0
    use_vref: true
    # Topic remappings
    odom_topic: '/car_state/odom_GT'
    path_topic: '/global_raceline'
    drive_topic: '/drive'
    target_speed: 1.5
    max_steer_angle: 0.55
    max_steer_rate: 3.0
    lateral_error_gain: 0.8
    heading_error_gain: 0.5
    curvature_feedforward_gain: 0.8
    smoothing_factor: 0.4
    direct_correction_gain: 0.5
    direct_correction_limit: 0.5
    pid_kp: 0.5
    pid_ki: 0.02
    pid_kd: 0.1
    use_path_interpolation: true
    steering_sign: 1.0  # Normal direction (positive = left turn)
