bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'car_state'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom_GT'
    ego_pose_topic: 'pose_GT' 
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'
    ego_imu_topic: 'vesc/sensors/imu/raw'

    # transform related
    scan_distance_to_base_link: 0.27

    # laserscan parameters
    scan_fov: 4.7
    scan_beams: 1080

    # map parameters
    map_img_ext: '.png'

    # opponent parameters
    num_agent: 2

    # ego starting pose on map - moved to safer position away from walls
    # Using raceline point ~50 (middle of track) to avoid A1 zone collision at start
    sx: 4.233191
    sy: -6.017884
    stheta: 3.344299

    # opp starting pose on map - placed further ahead of ego for natural FOLLOW behavior
    # Increased initial gap (approximately 6-8 meters ahead) so ego car is not 
    # "immediately on the opponent's bumper" from the beginning.
    # This allows:
    # - FOLLOW mode to look more natural with a larger gap
    # - Room to test new overtaking logic and following-distance behavior
    # Using raceline point further along the track
    sx1: 2.0
    sy1: -5.0
    stheta1: 3.344299

    # teleop
    kb_teleop: True
