pure_pursuit_node:
  ros__parameters:
    use_sim_time: true
    lookahead_distance: 1.5 # 전방 주시 거리 (미터)
    max_speed: 4.0          # 최대 주행 속도 (m/s)
    kp: 0.5                 # 속도 제어 비례 이득
    kd: 0.1                 # 속도 제어 미분 이득
    map_frame: "map"
    base_frame: "base_link"
    drive_topic: "/drive_nav"  # 중요: Mux의 navigation 채널로 발행
