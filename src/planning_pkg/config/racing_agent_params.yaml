# Racing Agent Configuration
# ===========================
# Configuration for the Racing Agent upper-level strategy controller
#
# This file defines:
# 1. OVERTAKE ZONEs - Pre-defined sections on the raceline where overtaking is allowed
# 2. Overtake trajectory parameters
# 3. Mode transition parameters
# 4. Corner exit smoothing parameters (v5.0)
# 5. Overtake feasibility parameters (v5.0)

racing_agent:
  ros__parameters:
    # === Decision Rate ===
    decision_rate: 20.0  # Hz - How often the agent makes decisions

    # === Speed Parameters ===
    cruise_speed: 6.0  # m/s - Default cruise speed (increased from 5.0 for faster racing)
    
    # === Following Parameters ===
    safe_follow_distance: 1.5  # m - Target following distance (ACC style)
    min_stop_distance: 0.3     # m - Emergency stop threshold
    
    # === Corner Exit Smoothing Parameters (v5.0) ===
    # These control how the car exits corners to prevent wall contact
    # The OUT-IN-OUT behavior is softened on exit to keep distance from outer wall
    #
    # corner_exit_wall_margin: Used by NMPC node's applyCornerExitSmoothing function
    #   to limit steering toward wall when exiting corners. Also declared in racing_agent
    #   for consistency but primarily affects real-time control. Range: 0.3-0.5m typical.
    corner_exit_wall_margin: 0.35    # m - Target minimum distance from wall on corner exit (reduced from 0.4 for more racing character)
    #
    # corner_exit_lateral_soften: Factor applied to lateral offset during exit phase
    #   in overtake trajectory generation (racing_agent).
    #   - 1.0 = no softening (original aggressive OUT behavior)
    #   - 0.85 = slight softening (balanced: visible OUT-IN-OUT with safety margin)
    #   - 0.7 = moderate softening (too conservative - kills racing line)
    #   - 0.5 = conservative softening (very safe, less racing-optimal)
    #   Lower values result in more conservative corner exit behavior.
    corner_exit_lateral_soften: 0.85  # Factor (0-1) - Slight reduction on exit, keeps visible OUT-IN-OUT
    
    # === Overtake Feasibility Parameters (v5.0) ===
    # These ensure overtakes only start when clearly feasible given opponent geometry
    # Being in an OVERTAKE ZONE is NOT by itself enough to start an overtake
    #
    # opponent_width: Assumed width of opponent vehicle. Could be made dynamic
    #   in future if perception provides opponent size estimation.
    opponent_width: 0.35             # m - Assumed opponent vehicle width
    overtake_width_factor: 1.1       # Factor > 1.0 multiplied by opponent width (reduced from 1.2 for more overtake opportunities)
    overtake_lateral_margin: 0.20    # m - Additional safety margin for overtake path (reduced from 0.25 for balanced behavior)
    min_longitudinal_window: 4.0     # m - Minimum longitudinal distance to complete overtake (reduced from 5.0 for more opportunities)
    
    # === Overtake Zone Definitions ===
    # Each zone is defined by (s_start, s_end) on the raceline
    # s is arc length in meters from the start of the track
    # 
    # IMPORTANT: Overtaking is ONLY allowed in these pre-defined zones.
    # The agent will NOT attempt ad-hoc overtaking outside these zones.
    # Even inside a zone, overtake only starts when feasibility checks pass.
    #
    # Zone types:
    # - NORMAL: Normal driving zone, no overtaking allowed
    # - OVERTAKE_ZONE: Overtaking is allowed with pre-computed trajectories
    
    n_overtake_zones: 2
    
    overtake_zone_0:
      name: "straight_1"
      s_start: 0.0     # meters (arc length)
      s_end: 15.0      # meters
      type: "OVERTAKE_ZONE"
      
    overtake_zone_1:
      name: "straight_2"  
      s_start: 50.0    # meters
      s_end: 65.0      # meters
      type: "OVERTAKE_ZONE"
    
    # === Pre-computed Overtake Trajectories ===
    # Each OVERTAKE_ZONE has multiple trajectory candidates
    # These are selected at runtime based on:
    # - Clearance on left/right side (must exceed opponent_width * factor + margin)
    # - Longitudinal window (must exceed min_longitudinal_window)
    # - Relative speed to preceding vehicle
    # - Obstacle proximity
    #
    # Trajectory types:
    # - left_lane_aggressive: Quick left overtake
    # - left_lane_soft: Gradual left overtake
    # - right_lane_aggressive: Quick right overtake
    # - right_lane_soft: Gradual right overtake
    
    overtake_lateral_offset: 0.75  # m - Maximum lateral offset during overtake (slightly reduced for safety)
    overtake_speed_boost: 1.3     # Factor - Speed boost during overtake (1.3 = 30% faster for decisive overtakes)
    
    # Trajectory generation parameters
    trajectory_s_curve_steepness: 0.5  # How sharp the S-curve is (0.0-1.0)
    trajectory_min_points: 20          # Minimum waypoints per trajectory
    
    # === Safety Parameters ===
    vehicle_width: 0.35    # m - F1TENTH vehicle width
    safety_margin: 0.15    # m - Additional safety margin
    min_overtake_clearance: 0.85  # m - Minimum clearance for overtake (2*width + margin)
    
    # === Obstacle Stop Parameters ===
    # IMPORTANT: When in OBSTACLE_STOP mode:
    # - v_ref = 0 (target speed is zero)
    # - Steering does NOT change abruptly
    # - NO "repulsion" or "bouncing" logic is used
    # - Vehicle stops safely and waits for upper-level re-planning
    
    obstacle_stop_decel_rate: 5.0  # m/s^2 - Deceleration rate when stopping
    obstacle_stop_steering_hold: true  # Hold steering angle when stopping
    
    # === Visualization ===
    enable_visualization: true
    raceline_color: [0.3, 0.3, 1.0, 0.8]       # RGBA - Global raceline (blue)
    overtake_zone_color: [0.0, 1.0, 0.0, 0.9]  # RGBA - Overtake zones (green)
    overtake_traj_left_color: [0.0, 0.5, 1.0, 0.5]   # RGBA - Left trajectories (blue)
    overtake_traj_right_color: [0.0, 1.0, 0.5, 0.5]  # RGBA - Right trajectories (cyan)
    active_traj_color: [1.0, 1.0, 0.0, 1.0]    # RGBA - Active trajectory (yellow)
